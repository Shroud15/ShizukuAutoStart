name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Determine APK version
        id: apkver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)"/\1/p' app/build.gradle | head -n1)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved APK version: ${version}"

      - name: Rename artifacts
        run: |
          base="ShizukuAutoStart-v${{ steps.apkver.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk "${base}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "${base}-release.apk"
          ls -l "${base}-debug.apk" "${base}-release.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuAutoStart-v${{ steps.apkver.outputs.version }}-apks
          path: |
            ShizukuAutoStart-v${{ steps.apkver.outputs.version }}-debug.apk
            ShizukuAutoStart-v${{ steps.apkver.outputs.version }}-release.apk
          if-no-files-found: error

  release:
    name: Attach APK to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine APK version
        id: apkver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release APK version: ${version}"

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ShizukuAutoStart-v${{ steps.apkver.outputs.version }}-apks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Shizuku Auto Start v${{ steps.apkver.outputs.version }}
          files: |
            ShizukuAutoStart-v${{ steps.apkver.outputs.version }}-debug.apk
            ShizukuAutoStart-v${{ steps.apkver.outputs.version }}-release.apk
          generate_release_notes: true
